services:
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.3-ls282
    container_name: sabnzbd
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /opt/appdata/media/sabnzbd:/config
      - /data/usenet:/data/usenet
    ports:
      - "192.168.0.231:8085:8080"
      - "100.105.219.6:8085:8080"
    restart: unless-stopped


  prowlarr:
    image: lscr.io/linuxserver/prowlarr:3.0.2.5780-ls169
    container_name: prowlarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /opt/appdata/media/prowlarr:/config
    ports:
      - "192.168.0.231:9696:9696"
      - "100.105.219.6:9696:9696"
    restart: unless-stopped

  radarr:
    image: lscr.io/linuxserver/radarr:7.0.3.10918-ls328
    container_name: radarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /opt/appdata/media/radarr:/config
      - /data:/data
    ports:
      - "192.168.0.231:7878:7878"
      - "100.105.219.6:7878:7878"
    restart: unless-stopped

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls5
    container_name: sonarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /opt/appdata/media/sonarr:/config
      - /data:/data
    ports:
      - "192.168.0.231:8989:8989"
      - "100.105.219.6:8989:8989"
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:12.4ubu2604-ls60
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - JELLYFIN_PublishedServerUrl=http://192.168.0.231:8096
    volumes:
      - /opt/appdata/media/jellyfin:/config
      - /data/media:/data/media:ro
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "192.168.0.231:8096:8096"
      - "100.105.219.6:8096:8096"
    restart: unless-stopped

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.2
    container_name: seerr
    init: true                                   # required by this image
    environment:
      - TZ=America/New_York
    volumes:
      - /opt/appdata/media/seerr:/app/config
    ports:
      - "192.168.0.231:5055:5055"
      - "100.105.219.6:5055:5055"
    restart: unless-stopped

  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls373
    container_name: bazarr
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /opt/appdata/media/bazarr:/config
      - /data:/data                              # writes .srt files next to the videos
    ports:
      - "192.168.0.231:6767:6767"
      - "100.105.219.6:6767:6767"
    restart: unless-stopped

  clonarr:
    image: ghcr.io/prophetse7en/clonarr:v3.5.0
    container_name: clonarr
    environment:
      - PUID=1000                                # template default is 99/100 (Unraid); yours is 1000
      - PGID=1000
      - TZ=America/New_York
    volumes:
      - /opt/appdata/media/clonarr:/config
    ports:
      - "192.168.0.231:6060:6060"
      - "100.105.219.6:6060:6060"
    restart: unless-stopped

  jellystat-db:
    image: postgres:16.16
    container_name: jellystat-db
    environment:
      - POSTGRES_USER=jellystat
      - POSTGRES_PASSWORD=${JELLYSTAT_DB_PASSWORD}
    volumes:
      - /opt/appdata/media/jellystat/db:/var/lib/postgresql/data
    restart: unless-stopped

  jellystat:
    image: cyfershepard/jellystat:1.1.12
    container_name: jellystat
    environment:
      - POSTGRES_USER=jellystat
      - POSTGRES_PASSWORD=${JELLYSTAT_DB_PASSWORD}
      - POSTGRES_IP=jellystat-db
      - POSTGRES_PORT=5432
      - JWT_SECRET=${JELLYSTAT_JWT_SECRET}
      - TZ=America/New_York
    volumes:
      - /opt/appdata/media/jellystat/backup:/app/backend/backup-data
    ports:
      - "192.168.0.231:3001:3000"
      - "100.105.219.6:3001:3000"
    depends_on:
      - jellystat-db
    restart: unless-stopped

  caddy:
    build: ./caddy
    image: homelab/caddy-crowdsec:2.11.9
    container_name: caddy
    environment:
      - CROWDSEC_API_KEY=${CROWDSEC_CADDY_KEY}
    depends_on:
      - crowdsec
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/appdata/media/caddy/data:/data
      - /opt/appdata/media/caddy/config:/config
      - /opt/appdata/media/caddy/logs:/var/log/caddy
    ports:
      - "192.168.0.231:80:80"
      - "192.168.0.231:443:443"
      - "192.168.0.231:443:443/udp"
    restart: unless-stopped

  gluetun:
    image: qmcgaw/gluetun:v3.41.0
    container_name: gluetun
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${PROTON_WG_PRIVATE_KEY}
      - SERVER_COUNTRIES=United States
      - PORT_FORWARD_ONLY=on
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8090/api/v2/app/setPreferences 2>&1'
      - FIREWALL_INPUT_PORTS=8090
      - TZ=America/New_York
    ports:
      - 192.168.0.231:8090:8090
      - 100.105.219.6:8090:8090
    volumes:
      - /opt/appdata/media/gluetun:/gluetun
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls487
    container_name: qbittorrent
    network_mode: service:gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/New_York
      - WEBUI_PORT=8090
    volumes:
      - /opt/appdata/media/qbittorrent:/config
      - /data:/data
    restart: unless-stopped

  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.2
    container_name: crowdsec
    environment:
      - COLLECTIONS=crowdsecurity/caddy crowdsecurity/http-cve LePresidente/jellyfin
      - TZ=America/New_York
    volumes:
      - /opt/appdata/media/crowdsec/config:/etc/crowdsec
      - /opt/appdata/media/crowdsec/data:/var/lib/crowdsec/data
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./crowdsec/whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/home-whitelist.yaml:ro
      - /opt/appdata/media/caddy/logs:/var/log/caddy:ro
      - /opt/appdata/media/jellyfin/log:/var/log/jellyfin:ro
    restart: unless-stopped


  navidrome:
    image: deluan/navidrome:0.64.2
    container_name: navidrome
    user: 1000:1000
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
      - ND_ENABLEINSIGHTSCOLLECTOR=false
    volumes:
      - /opt/appdata/media/navidrome:/data
      - /data/media/music:/music:ro
    ports:
      - 192.168.0.231:4533:4533
      - 100.105.219.6:4533:4533
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:v2.7.0
    container_name: homepage
    restart: unless-stopped
    environment:
      HOMEPAGE_ALLOWED_HOSTS: nas:3000,192.168.0.231:3000,100.105.219.6:3000
      PUID: 1000
      PGID: 1000
      HOMEPAGE_VAR_JELLYFIN_KEY: ${HOMEPAGE_JELLYFIN_KEY}
      HOMEPAGE_VAR_SEERR_KEY: ${HOMEPAGE_SEERR_KEY}
      HOMEPAGE_VAR_SONARR_KEY: ${HOMEPAGE_SONARR_KEY}
      HOMEPAGE_VAR_RADARR_KEY: ${HOMEPAGE_RADARR_KEY}
      HOMEPAGE_VAR_PROWLARR_KEY: ${HOMEPAGE_PROWLARR_KEY}
      HOMEPAGE_VAR_BAZARR_KEY: ${HOMEPAGE_BAZARR_KEY}
      HOMEPAGE_VAR_SABNZBD_KEY: ${HOMEPAGE_SABNZBD_KEY}
      HOMEPAGE_VAR_QBIT_KEY: ${HOMEPAGE_QBIT_KEY}
    volumes:
      - ./homepage:/app/config
      - /data:/data:ro              # read-only, only for the free-space bar
    ports:
      - 192.168.0.231:3000:3000
      - 100.105.219.6:3000:3000

  kavita:
    image: lscr.io/linuxserver/kavita:v0.9.1.4-ls133
    container_name: kavita
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: America/New_York
    volumes:
      - /opt/appdata/media/kavita:/config
      - /data/media/books/manga:/manga:ro                # read-only,
      - /data/media/books/lightnovels:/lightnovels:ro
    ports:
      - 192.168.0.231:5000:5000                          # LAN + Tailscale only
      - 100.105.219.6:5000:5000
  tranga-pg:
    image: postgres:17.12
    container_name: tranga-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TRANGA_PG_PASSWORD:?set TRANGA_PG_PASSWORD in .env}
    volumes:
      - /opt/appdata/media/tranga/pg:/var/lib/postgresql/data     # the database survives recreates
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    # no ports: the database is only reachable from Tranga, over the Docker network
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  tranga-api:
    image: glax/tranga-api@sha256:91aa391a4edfda77f1d5c2d0bf5102d860884d3eb63265c4edf2b6281c214ff3
    container_name: tranga-api
    user: "1000:1000"
    restart: unless-stopped
    depends_on:
      tranga-pg:
        condition: service_healthy
    environment:
      POSTGRES_HOST: tranga-pg
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TRANGA_PG_PASSWORD:?set TRANGA_PG_PASSWORD in .env}
      CREATE_COMICINFO_XML: "true"           # writes metadata Kavita reads (series, chapter, etc.)
    volumes:
      - /data/media/books/manga:/Manga                        # the folder Kavita reads (read-only there)
      - /opt/appdata/media/tranga/settings:/usr/share/tranga-api
    ports:
      - 192.168.0.231:6531:6531               # your browser calls the API directly, so LAN + Tailscale
      - 100.105.219.6:6531:6531
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }

  tranga-website:
    image: glax/tranga-website@sha256:e67f26a5c10d54fa8233cca57a90917ec0c78e4dfccde8d88486322b1b2c0ca8
    container_name: tranga-website
    restart: unless-stopped
    depends_on: [tranga-api]
    ports:
      - 192.168.0.231:9555:80
      - 100.105.219.6:9555:80
    logging: { driver: json-file, options: { max-size: "10m", max-file: "5" } }
