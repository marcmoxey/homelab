global:
  scrape_interval: 15s # scrape targets every 15 seconds
  evaluation_interval: 15s

  # Labels attached to all metrics and alerts sent to external systems
  external_labels:
    monitor: 'homelab'

# Where Prometheus send the firing alerts
alerting:
  alertmanagers:
    - static_configs:
       - targets: ['alertmanager:9093']

# Alert rule files
rule_files:
    - /etc/prometheus/rules/*.yml


scrape_configs:
  # job_name becomes the label job="prometheus" on every metric from this job
  - job_name: 'prometheus'

    # Scrape this job every 5 seconds instead of the global 15s
    scrape_interval: 5s

    static_configs:
      - targets: ['localhost:9090'] # Prometheus scraping itself, inside its own container

  # Beelink host metrics from node_exporter
  - job_name: 'node'
    static_configs:
      - targets: ['100.66.160.124:9100']
