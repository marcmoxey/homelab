services:
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
      - '--web.listen-address=100.105.219.6:9100'
    network_mode: host
    pid: host
    volumes:
      - '/:/host:ro,rslave'
    restart: unless-stopped

  smartctl-exporter:
    image: prometheuscommunity/smartctl-exporter:v0.9.1
    container_name: smartctl-exporter
    privileged: true
    user: root
    ports:
      - "100.105.219.6:9633:9633"
    restart: unless-stopped

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.61.0
    command:
      - '--docker_only=true'
      - '--housekeeping_interval=30s'
    ports:
     - "100.105.219.6:8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    restart: unless-stopped
