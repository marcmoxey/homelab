# Samba config for the NAS — file share on tank/files
# Reachable only from the LAN (192.168.0.0/24) and Tailscale (100.64.0.0/10) via UFW.
# Never port-forward 445.

[global]
   # --- Identity ---
   workgroup = WORKGROUP
   server string = NAS
   server role = standalone server

   # --- Security ---
   server min protocol = SMB3
   map to guest = never
   usershare allow guests = no
   disable netbios = yes
   smb ports = 445

   # --- No printers ---
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   # --- Logging ---
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file

   # --- macOS support ---
   vfs objects = fruit streams_xattr
   fruit:metadata = stream
   fruit:model = MacSamba
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

[nasfileshare]
   path = /tank/files
   valid users = mmoxey
   read only = no
   browseable = yes

   # Everything written here is owned by mmoxey with normal permissions,
   # no matter what the Mac or Windows asks for.
   force user = mmoxey
   force group = mmoxey
   create mask = 0664
   directory mask = 0775
   force create mode = 0664
   force directory mode = 0775
   inherit acls = no
   nt acl support = no

[music]
   path = /data/media/music
   browseable = yes
   read only = no
   valid users = mmoxey
   force user = mmoxey
   force group = mmoxey
   create mask = 0664
   directory mask = 0775

[books]
   path = /data/media/books
   browseable = yes
   read only = no
   valid users = mmoxey
   force user = mmoxey
   force group = mmoxey
   create mask = 0664
   directory mask = 0775
