groups:
  - name: homelab
    rules:
      - alert: TargetDown           # a scrape target is unreachable
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} on {{ $labels.instance }} is down"
          runbook_url: "https://github.com/marcmoxey/homelab/blob/main/docs/runbooks/target-down.md"


      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Dead man's switch: always firing while alerting works"
          runbook_url: "https://github.com/marcmoxey/homelab/blob/main/docs/runbooks/watchdog-down.md"

      - alert: DriveHot
        expr: smartctl_device_temperature{temperature_type="current"} > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.device }} on {{ $labels.instance }} is {{ $value }}°C"
          runbook_url: "https://github.com/marcmoxey/homelab/blob/main/docs/runbooks/drive-hot.md"

      - alert: DriveFailing
        expr: smartctl_device_smart_status != 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.device }} on {{ $labels.instance }} failed its SMART health check"
          runbook_url: "https://github.com/marcmoxey/homelab/blob/main/docs/runbooks/drive-failing.md"


      - alert: MinecraftDown
        expr: minecraft_status_healthy == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Minecraft server {{ $labels.server_host }} is not responding"
          runbook_url: "https://github.com/marcmoxey/homelab/blob/main/docs/runbooks/minecraft-down.md"


      - alert: ZpoolNotOnline
        expr: node_zfs_zpool_state{state="online"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ZFS pool {{ $labels.zpool }} is not ONLINE (degraded or worse)"
          runbook_url: "https://github.com/marcmoxey/homelab/blob/main/docs/runbooks/zpool-not-online.md"


      - alert: LowMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.instance }} has less than 10% RAM available"
          runbook_url: "https://github.com/marcmoxey/homelab/blob/main/docs/runbooks/low-memory.md"


      - alert: BookStackDown
        expr: probe_success{service="bookstack"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "BookStack is not loading ({{ $labels.instance }})"
          runbook_url: "https://github.com/marcmoxey/homelab/blob/main/docs/runbooks/bookstack-down.md"
