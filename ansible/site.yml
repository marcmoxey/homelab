# For all computers, act as the boss  and do three jobs in order: make it safe, install Docker, install Tailscale.
- name: Base setup for every homelab host
  hosts: all
  become: true
  roles:
    - base
    - docker
    - tailscale

# NAS only: storage, shares, UPS and the scheduled backup jobs.
- name: NAS-specific setup
  hosts: nas
  become: true
  roles:
    - nas
