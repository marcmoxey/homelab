services:
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:1.18.0
    container_name: cloudflare-ddns
    user: "1000:1000"
    read_only: true
    cap_drop: [all]
    security_opt: [no-new-privileges:true]
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN}
      - DOMAINS=watch.marcshometheater.org,request.marcshometheater.org,music.marcshometheater.org,invite.marcshometheater.org
      - PROXIED=false
      - IP6_PROVIDER=none
      - HEALTHCHECKS=${HEALTHCHECKS}
      - TZ=America/New_York
    restart: unless-stopped
