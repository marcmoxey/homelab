global:
  scrape_interval: 15s # scrape targets every 15 seconds
  evaluation_interval: 15s

  # Labels attached to all metrics and alerts sent to external systems
  external_labels:
    monitor: 'homelab'

# Where Prometheus send the firing alerts
alerting:
  alertmanagers:
    - static_configs:
       - targets: ['alertmanager:9093']

# Alert rule files
rule_files:
    - /etc/prometheus/rules/*.yml


scrape_configs:
  # job_name becomes the label job="prometheus" on every metric from this job
  - job_name: 'prometheus'

    # Scrape this job every 5 seconds instead of the global 15s
    scrape_interval: 5s

    static_configs:
      - targets: ['localhost:9090'] # Prometheus scraping itself, inside its own container

  # Beelink host metrics from node_exporter
  - job_name: 'node'
    static_configs:
      - targets: ['100.66.160.124:9100', '100.105.219.6:9100']

  - job_name: 'smartctl'
    static_configs:
      - targets: ['100.105.219.6:9633']


  - job_name: "minecraft"
    static_configs:
      - targets: ["100.105.219.6:9150"]

  - job_name: cadvisor
    static_configs:
      - targets: ["100.105.219.6:8081"]

  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://100.105.219.6:8090/']
        labels:
          service: qbittorrent
          severity: warning
      - targets: ["http://100.105.219.6:6875/login"]
        labels:
          service: bookstack
          severity: warning
      - targets: ["https://nas.tailf2e508.ts.net/alive"]
        labels:
          service: vaultwarden
          severity: critical
      - targets: ["http://100.105.219.6:2283/api/server/ping"]
        labels:
          service: immich
          severity: warning
      - targets: ['https://watch.marcshometheater.org/health']
        labels:
          service: jellyfin-public
          severity: critical
      - targets: ['https://request.marcshometheater.org/api/v1/status']
        labels:
          service: seerr-public
          severity: warning
      - targets: ['https://invite.marcshometheater.org']
        labels:
          service: wizarr-public
          severity: warning
      - targets: ["http://100.105.219.6:8096/health"]
        labels: { service: jellyfin, severity: critical }
      - targets: ["http://100.105.219.6:5055/api/v1/status"]
        labels: { service: seerr, severity: warning }
      - targets: ["http://100.105.219.6:8989/ping"]
        labels: { service: sonarr, severity: warning }
      - targets: ["http://100.105.219.6:7878/ping"]
        labels: { service: radarr, severity: warning }
      - targets: ["http://100.105.219.6:9696/ping"]
        labels: { service: prowlarr, severity: warning }
      - targets: ["http://100.105.219.6:8085/"]
        labels: { service: sabnzbd, severity: warning }
      - targets: ['http://100.105.219.6:4533/app/']
        labels: { service: navidrome, severity: warning }
      - targets: ['https://music.marcshometheater.org/app/']
        labels: { service: navidrome-public, severity: warning }
      - targets: ['http://192.168.0.231:5000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
