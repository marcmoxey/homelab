services: # start list of containers to run
  prometheus: # service name 
    image: prom/prometheus:v3.13.5 # pulls the latest image
    container_name: prometheus # fixed container name
    ports: # publish port 
      - "100.66.160.124:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro # mounts config file to container
      - prometheus_data:/prometheus # mounts the name volume
      - ./prometheus/rules:/etc/prometheus/rules:ro # alert rules
    command: # override the image default startup arguments 
      - '--config.file=/etc/prometheus/prometheus.yml' # where to find file mounted above
      - '--storage.tsdb.path=/prometheus' # where to store the metrics 
      - '--storage.tsdb.retention.time=30d' # keep metrics for 30 days 
    restart: unless-stopped # docker restarts the container if it crashes 

  node-exporter: # host metrics for the beelink 
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: node-exporter
    command:
      - '--path.rootfs=/host' # read the host metrics from the mounted root
      - '--web.listen-address=100.66.160.124:9100' # only listen on tailscale
    network_mode: host # use the beelink network directly
    pid: host # see the host processes 
    volumes:
      - '/:/host:ro,rslave' # host filesystem, read-only 
    restart: unless-stopped

  grafana: # dashbaords 
    image: grafana/grafana-oss:13.0.2
    container_name: grafana
    ports:
      - "100.66.160.124:3000:3000" # Tailscale
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana # dashboard, users, settings
      - ./grafana/provisioning:/etc/grafana/provisioning:ro # data sources as code
    depends_on:
      - prometheus
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy:v2.37.2
    container_name: ntfy
    command:
      - serve
    environment:
      - TZ=America/New_York
    ports:
      - "100.66.160.124:8080:80"
    volumes:
      - ./ntfy/server.yml:/etc/ntfy/server.yml:ro # config, read-only
      - ntfy_cache:/var/cache/ntfy # message cache 
      - ntfy_data:/var/lib/ntfy # users/auth database
    restart: unless-stopped

  alertmanager: # routes alerts from Prometheus to ntfy bridge
    image: prom/alertmanager:0.34.2
    container_name: alertmanager
    ports:
      - "100.66.160.124:9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro # config, read-only
      - alertmanager_data:/alertmanager # silences and notification state
      - ./alertmanager/secrets:/etc/alertmanager/secrets:ro # Healthcheck pings url
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    restart: unless-stopped

  ntfy-alertmanager: # converts alertmanager webhooks into ntfy notifications
    image: xenrox/ntfy-alertmanager:1.0.2
    container_name: ntfy-alertmanager
    volumes:
      - ./ntfy-alertmanager/config:/etc/ntfy-alertmanager/config:ro
    depends_on:
      - ntfy
    restart: unless-stopped




volumes:
  prometheus_data:
  grafana_data:
  ntfy_cache:
  ntfy_data:
  alertmanager_data:
