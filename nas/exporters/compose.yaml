services:
  node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1
    container_name: node_exporter
    command:
      - '--path.rootfs=/host'
      - '--web.listen-address=100.105.219.6:9100'
    network_mode: host
    pid: host
    volumes:
      - '/:/host:ro,rslave'
    restart: unless-stopped

  smartctl-exporter:
    image: prometheuscommunity/smartctl-exporter:v0.9.1
    container_name: smartctl-exporter
    privileged: true
    user: root
    ports:
      - "100.105.219.6:9633:9633"
    restart: unless-stopped

