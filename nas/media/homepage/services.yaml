# Homepage services: one tile per app.
# Widgets talk to apps by container name over the media network (sonarr:8989).
# Links (href) use the LAN/Tailscale name "nas" so they open from your browser.
# API keys come from nas/media/.env via {{HOMEPAGE_VAR_...}}; never put keys here.

- Watch:
    - Jellyfin:
        icon: jellyfin.png
        href: http://nas:8096
        description: Movies and TV
        siteMonitor: http://jellyfin:8096/health
        widget:
          type: jellyfin
          url: http://jellyfin:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_KEY}}"
          version: 2            # set to 2 if Jellyfin is 10.12 or newer
          enableBlocks: true
          enableNowPlaying: true
    - Seerr:
        icon: jellyseerr.png
        href: http://nas:5055
        description: Requests
        siteMonitor: http://seerr:5055/api/v1/status
        widget:
          type: seerr
          url: http://seerr:5055
          key: "{{HOMEPAGE_VAR_SEERR_KEY}}"

- Manage:
    - Sonarr:
        icon: sonarr.png
        href: http://nas:8989
        siteMonitor: http://sonarr:8989/ping
        widget:
          type: sonarr
          url: http://sonarr:8989
          key: "{{HOMEPAGE_VAR_SONARR_KEY}}"
    - Radarr:
        icon: radarr.png
        href: http://nas:7878
        siteMonitor: http://radarr:7878/ping
        widget:
          type: radarr
          url: http://radarr:7878
          key: "{{HOMEPAGE_VAR_RADARR_KEY}}"
    - Prowlarr:
        icon: prowlarr.png
        href: http://nas:9696
        siteMonitor: http://prowlarr:9696/ping
        widget:
          type: prowlarr
          url: http://prowlarr:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_KEY}}"
    - Bazarr:
        icon: bazarr.png
        href: http://nas:6767
        siteMonitor: http://bazarr:6767
        widget:
          type: bazarr
          url: http://bazarr:6767
          key: "{{HOMEPAGE_VAR_BAZARR_KEY}}"

- Downloads:
    - SABnzbd:
        icon: sabnzbd.png
        href: http://nas:8085
        description: Usenet
        siteMonitor: http://sabnzbd:8080
        widget:
          type: sabnzbd
          url: http://sabnzbd:8080
          key: "{{HOMEPAGE_VAR_SABNZBD_KEY}}"
    - qBittorrent:
        icon: qbittorrent.png
        href: http://nas:8090
        description: Torrents (VPN only)
        siteMonitor: http://gluetun:8090
        widget:
          type: qbittorrent
          url: http://gluetun:8090      # qBittorrent lives in gluetun's network
          key: "{{HOMEPAGE_VAR_QBIT_KEY}}"
